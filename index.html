/* Custom scrollbar styles for a Netflix-like feel */
/* For Webkit-based browsers (Chrome, Safari) */
.scrollbar-thin::-webkit-scrollbar {
  height: 8px;
}
.scrollbar-thin::-webkit-scrollbar-track {
  background: transparent;
}
.scrollbar-thin::-webkit-scrollbar-thumb {
  background-color: rgba(75, 85, 99, 0.7); /* gray-600 with opacity */
  border-radius: 20px;
}
.scrollbar-thin::-webkit-scrollbar-thumb:hover {
  background-color: rgba(107, 114, 128, 0.7); /* gray-500 with opacity */
}

/* For Firefox */
.scrollbar-thin {
  scrollbar-width: thin;
  scrollbar-color: rgba(75, 85, 99, 0.7) transparent; /* thumb and track color */
}
